<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>LiveRecall Student Client</title>
  <style>
   body {
  font-family: Inter, system-ui, sans-serif;
  max-width: 1100px;
  margin: 0 auto;
  padding: 2rem;
  background: #eef3f8;
  color: #172033;
}

h1 {
  margin-bottom: 0.25rem;
  color: #102a43;
}

#status {
  display: inline-block;
  padding: 0.35rem 0.8rem;
  border-radius: 999px;
  background: #dbeafe;
  color: #1e40af;
  font-weight: 700;
}

#live {
  min-height: 18rem;
  max-height: 32rem;
  overflow-y: auto;
  background: #ffffff;
  border: 1px solid #d6e0ea;
  border-radius: 1rem;
  padding: 1.5rem;
  margin: 1.5rem 0;
  box-shadow: 0 8px 24px rgba(30, 58, 95, 0.08);
}

.caption-row {
  display: flex;
  align-items: baseline;
  gap: 0.75rem;
  padding: 0.7rem 0;
  border-bottom: 1px solid #e7edf3;
}

.caption-text {
  flex: 1;
}

.caption-meta {
  color: #8291a6;
  font-size: 0.75rem;
  white-space: nowrap;
}

.final-line {
  color: #172033;
  font-weight: 600;
}

.provisional-line {
  color: #64748b;
  font-style: italic;
  border-left: 3px solid #315a85;
  padding-left: 0.75rem;
  background: #f5f8fb;
}

button {
  padding: 0.7rem 1rem;
  margin: 0.25rem;
  border: 1px solid #b8c7d8;
  border-radius: 0.6rem;
  background: #ffffff;
  color: #183b5b;
  font-weight: 600;
  cursor: pointer;
}

button:hover {
  background: #eaf1f8;
  border-color: #315a85;
}

#recall {
  white-space: pre-wrap;
  margin-top: 1rem;
  padding: 1rem;
  background: #f8fafc;
  border-left: 4px solid #315a85;
  border-radius: 0.4rem;
  color: #334e68;
}

.hint {
  color: #627d98;
}
  </style>
</head>
<body>
  <h1>LiveRecall</h1>
  <p>Connection: <span id="status">disconnected</span></p>
  <p class="hint">Starter behavior is intentionally naive: every received revision is appended as a new line.</p>
  <div id="live"></div>
  <div>
    <button data-seconds="30">What did I miss? (30 s)</button>
    <button data-seconds="15">15 s</button>
    <button data-seconds="60">60 s</button>
  </div>
  <div id="recall">TODO: implement the locally maintained recall view.</div>
  <script src="app.js"></script>
</body>
</html>
