<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>LiveRecall Student Client</title>
  <style>
   body {
  font-family: Inter, system-ui, sans-serif;
  max-width: 1100px;
  margin: 0 auto;
  padding: 2rem;
  background: #f3f8fc;
  color: #172033;
}

#live {
  background: #ffffff;
  border: 1px solid #d9e5ef;
  box-shadow: 0 8px 24px rgba(43, 76, 109, 0.06);
}

.provisional-line {
  color: #718096;
  background: #f7fbff;
  border-left: 3px solid #6b8fb3;
}

.final-line {
  color: #243b53;
}

button {
  background: #ffffff;
  color: #294c6b;
  border: 1px solid #c6d7e6;
}

button:hover {
  background: #eaf3fa;
}
  </style>
</head>
<body>
  <h1>LiveRecall</h1>
  <p>Connection: <span id="status">disconnected</span></p>
  <p class="hint">Starter behavior is intentionally naive: every received revision is appended as a new line.</p>
  <div id="live"></div>
  <div>
    <button data-seconds="30">What did I miss? (30 s)</button>
    <button data-seconds="15">15 s</button>
    <button data-seconds="60">60 s</button>
  </div>
  <div id="recall">TODO: implement the locally maintained recall view.</div>
  <script src="app.js"></script>
</body>
</html>
